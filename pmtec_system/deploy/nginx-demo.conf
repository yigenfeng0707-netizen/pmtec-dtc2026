# PMTEC 演示中心 nginx 配置（挂载为 /etc/nginx/conf.d/default.conf）
# 三段路由：
#   /        静态展示页（auth_request 会话门禁，未登录 302 → /login.html）
#   /api/    REST 网关反代（同源，携带会话 Cookie；鉴权由网关 JWT 中间件强制）
#   /ws      WebSocket 实时推送反代（telemetry 只读流，未强制鉴权）
# 登录页本身免门禁；鉴权数据面在 pmtec-engine:8080（JWT），本配置只做会话预检。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文件上传/大视频
    client_max_body_size 0;

    location = /login.html {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://pmtec-engine:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 参谋官 LLM 调用可达数十秒
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://pmtec-engine:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ =404;
    }

    # 内部子请求：转发客户端 Cookie 到网关 /auth/check，2xx=放行 401=拒绝
    location = /_auth_check {
        internal;
        proxy_pass http://pmtec-engine:8080/api/v1/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        # auth_request 子请求 5xx 不应阻断静态页
        error_page 500 502 503 504 = @gateway_down;
    }

    location @gateway_down {
        # 网关瞬时不可用时放行静态页（演示可用性优先，数据面仍有 JWT 门禁）
        try_files $uri $uri/ =404;
    }

    location @login_redirect {
        return 302 /login.html?next=$request_uri;
    }
}
