# PMTEC Digital Battlefield - Docker Compose (P8-v2)
# Full stack: 4 DTB services + Prometheus + Grafana + Jaeger tracing
# P8-v2: Adds Jaeger distributed tracing, P7-v2: HA backup, health checks, security

version: "3.8"

services:
  # ============================================================
  # DTB Services (4 distributed gRPC services)
  # ============================================================

  # Service 1: WarEngine - Simulation core (ASDA loop, LVC, EW/Cyber)
  war-engine:
    build: .
    image: pmtec-distributed:latest
    container_name: pmtec-war-engine
    command: ["--service", "war_engine", "--host", "0.0.0.0"]
    ports:
      - "50051:50051"
      - "9090:9090"
    environment:
      - PMTEC_HOST=0.0.0.0
      - PMTEC_HEADLESS=1
      - PROMETHEUS_ENABLED=1
      - PROMETHEUS_PORT=9090
      - SECURITY_ENABLED=0
      - LIVE_DATA_USE_REAL_API=0
      - GRPC_HA_ENABLED=0
      - PMTEC_TRACING=1
      - PMTEC_TRACING_ENDPOINT=jaeger:4317
    volumes:
      - pmtec-data:/pmtec/data
      - pmtec-output:/pmtec/output
    networks:
      - pmtec-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; ch = grpc.insecure_channel('localhost:50051'); stub = health_pb2_grpc.HealthStub(ch); r = stub.Check(health_pb2.HealthCheckRequest(service=''), timeout=5); exit(0 if r.status == 1 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Service 2: BattleNetwork - Track distribution + entity status
  battle-network:
    build: .
    image: pmtec-distributed:latest
    container_name: pmtec-battle-network
    command: ["--service", "battle_network", "--host", "0.0.0.0"]
    ports:
      - "50052:50052"
    environment:
      - PMTEC_HOST=0.0.0.0
      - PMTEC_HEADLESS=1
      - PROMETHEUS_ENABLED=0
    volumes:
      - pmtec-data:/pmtec/data
      - pmtec-output:/pmtec/output
    networks:
      - pmtec-net
    restart: unless-stopped
    depends_on:
      war-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; ch = grpc.insecure_channel('localhost:50052'); stub = health_pb2_grpc.HealthStub(ch); r = stub.Check(health_pb2.HealthCheckRequest(service=''), timeout=5); exit(0 if r.status == 1 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Service 3: ApplicationStore - Capability modules + DQN inference
  application-store:
    build: .
    image: pmtec-distributed:latest
    container_name: pmtec-app-store
    command: ["--service", "application_store", "--host", "0.0.0.0"]
    ports:
      - "50053:50053"
    environment:
      - PMTEC_HOST=0.0.0.0
      - PMTEC_HEADLESS=1
      - PROMETHEUS_ENABLED=0
    volumes:
      - pmtec-data:/pmtec/data
      - pmtec-output:/pmtec/output
    networks:
      - pmtec-net
    restart: unless-stopped
    depends_on:
      war-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; ch = grpc.insecure_channel('localhost:50053'); stub = health_pb2_grpc.HealthStub(ch); r = stub.Check(health_pb2.HealthCheckRequest(service=''), timeout=5); exit(0 if r.status == 1 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Service 4: PlugAndPlay - Discovery + plugin lifecycle + DT registry
  plug-and-play:
    build: .
    image: pmtec-distributed:latest
    container_name: pmtec-plug-and-play
    command: ["--service", "plug_and_play", "--host", "0.0.0.0"]
    ports:
      - "50054:50054"
    environment:
      - PMTEC_HOST=0.0.0.0
      - PMTEC_HEADLESS=1
      - PROMETHEUS_ENABLED=0
    volumes:
      - pmtec-data:/pmtec/data
      - pmtec-output:/pmtec/output
    networks:
      - pmtec-net
    restart: unless-stopped
    depends_on:
      war-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2, health_pb2_grpc; ch = grpc.insecure_channel('localhost:50054'); stub = health_pb2_grpc.HealthStub(ch); r = stub.Check(health_pb2.HealthCheckRequest(service=''), timeout=5); exit(0 if r.status == 1 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================
  # HA Backup Instance (P7-v2) - WarEngine failover target
  # ============================================================
  war-engine-backup:
    build: .
    image: pmtec-distributed:latest
    container_name: pmtec-war-engine-backup
    command: ["--service", "war_engine", "--host", "0.0.0.0"]
    ports:
      - "50061:50051"
    environment:
      - PMTEC_HOST=0.0.0.0
      - PMTEC_HEADLESS=1
      - PROMETHEUS_ENABLED=0
      - GRPC_HA_ENABLED=1
    volumes:
      - pmtec-data:/pmtec/data
      - pmtec-output:/pmtec/output
    networks:
      - pmtec-net
    restart: unless-stopped
    profiles:
      - ha  # only started with: docker-compose --profile ha up

  # ============================================================
  # Observability Stack (P7-v2)
  # ============================================================

  # Prometheus - Metrics scraping
  prometheus:
    image: prom/prometheus:latest
    container_name: pmtec-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - pmtec-prometheus:/prometheus
    networks:
      - pmtec-net
    restart: unless-stopped
    depends_on:
      - war-engine

  # Grafana - Dashboard visualization
  grafana:
    image: grafana/grafana:latest
    container_name: pmtec-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/pmtec_dashboard.json
      - pmtec-grafana:/var/lib/grafana
    networks:
      - pmtec-net
    restart: unless-stopped
    depends_on:
      - prometheus

  # Jaeger - Distributed tracing (P8-v2)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: pmtec-jaeger
    ports:
      - "4317:4317"    # OTLP gRPC
      - "16686:16686"  # Jaeger UI
    networks:
      - pmtec-net
    restart: unless-stopped

networks:
  pmtec-net:
    driver: bridge
    name: pmtec-distributed-net

volumes:
  pmtec-data:
    name: pmtec-shared-data
  pmtec-output:
    name: pmtec-shared-output
  pmtec-prometheus:
    name: pmtec-prometheus-data
  pmtec-grafana:
    name: pmtec-grafana-data
