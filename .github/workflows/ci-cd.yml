# PMTEC Digital Battlefield - GitHub Actions CI/CD Pipeline (P7-v2)
# Triggers: push to main, pull requests, version tags
# Stages: lint -> test -> build -> security scan -> push -> deploy

name: PMTEC CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pmtec-distributed

jobs:
  # ============================================================
  # Stage 1: Lint & Syntax Check
  # ============================================================
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install ruff pyyaml

      - name: Ruff lint
        run: ruff check pmtec_system/ || true

      - name: YAML syntax validation
        run: |
          python -c "
          import yaml, sys, os
          yaml_files = []
          for root, dirs, files in os.walk('pmtec_system'):
              for f in files:
                  if f.endswith(('.yml', '.yaml')):
                      yaml_files.append(os.path.join(root, f))
          errors = []
          for yf in yaml_files:
              try:
                  with open(yf) as fh:
                      yaml.safe_load(fh)
                  print(f'  OK: {yf}')
              except Exception as e:
                  errors.append(f'{yf}: {e}')
          if errors:
              print('YAML errors:')
              for e in errors:
                  print(f'  FAIL: {e}')
              sys.exit(1)
          print(f'All {len(yaml_files)} YAML files validated')
          "

      - name: Dockerfile syntax check
        run: |
          if [ -f pmtec_system/Dockerfile ]; then
            docker build --check pmtec_system/ || true
          fi

  # ============================================================
  # Stage 2: Unit Tests
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd pmtec_system
          pip install -r requirements.txt

      - name: Generate proto stubs
        run: |
          cd pmtec_system
          python -m grpc_tools.protoc \
            -I./proto \
            --python_out=./proto/generated \
            --grpc_python_out=./proto/generated \
            proto/dtb_model.proto || true

      - name: Import smoke tests
        env:
          PYTHONPATH: pmtec_system
        run: |
          cd pmtec_system
          python -c "
          import sys; sys.path.insert(0, 'proto/generated')
          from config import GRPC_HOST, GRPC_PORT
          print(f'[OK] config: {GRPC_HOST}:{GRPC_PORT}')
          from services.prometheus_metrics import MetricsExporter
          m = MetricsExporter()
          print(f'[OK] prometheus: {m.enabled}')
          from live_data import LiveAdapterManager
          mgr = LiveAdapterManager()
          print(f'[OK] live_data: adsb={mgr.adsb.use_real_api}')
          print('All imports successful')
          "

      # P14 ontology + P16 DoDAF acceptance gates (HermiT needs a JVM — preinstalled on ubuntu runners)
      - name: Ontology acceptance tests (P14/P16)
        env:
          PYTHONPATH: pmtec_system
        run: |
          cd pmtec_system
          python test_p14_ontology.py
          python test_p16_dodaf.py

  # ============================================================
  # Stage 3: Docker Build
  # ============================================================
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (remove preinstalled SDKs, ~40GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: pmtec_system
          file: pmtec_system/Dockerfile
          push: false
          tags: pmtec-distributed:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -d --name pmtec-test \
            -e PROMETHEUS_ENABLED=1 \
            -p 50051:50051 \
            -p 9090:9090 \
            pmtec-distributed:ci \
            --service war_engine --host 0.0.0.0 || true
          sleep 10
          # Check if container is running
          docker ps | grep pmtec-test || echo "Container check (may exit if service_launcher not configured)"
          docker stop pmtec-test 2>/dev/null || true

  # ============================================================
  # Stage 4: Security Scan
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: pmtec_system
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true  # 私有仓库无 GHAS 许可时上传受限, 扫描本身已完成
        with:
          sarif_file: trivy-results.sarif

  # ============================================================
  # Stage 5: Push to Container Registry (on tags/main)
  # ============================================================
  push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: pmtec_system
          file: pmtec_system/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Stage 6: Deploy (on version tags - manual trigger)
  # ============================================================
  deploy:
    name: Deploy (Staging)
    runs-on: ubuntu-latest
    needs: push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "## PMTEC Deploy: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To deploy:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
